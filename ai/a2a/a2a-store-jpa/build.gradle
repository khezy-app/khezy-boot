plugins {
    id("khezy.java-library")
    id("io.spring.dependency-management") version "1.1.7"
}

group = "io.github.khezyapp"
version = "1.0.0"

ext {
    a2aCoreVersion = '1.0.0'
    cryptoVersion = '1.0.0'
    springBootVersion = '4.1.0'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:${springBootVersion}"
    }
}

dependencies {
    api "io.github.khezyapp:a2a-core:${a2aCoreVersion}"
    api "io.github.khezyapp:khezy-crypto:${cryptoVersion}"
    api "org.springframework.boot:spring-boot-starter-data-jpa"

    testImplementation "org.springframework.boot:spring-boot-starter-test"
    testImplementation "com.h2database:h2"
}

mavenPublishing {
    pom {
        name = "Khezy A2A Store JPA"
        description = """
        JPA-backed task, task-state and push-notification stores for A2A with
        encryption at rest."""
    }
}
