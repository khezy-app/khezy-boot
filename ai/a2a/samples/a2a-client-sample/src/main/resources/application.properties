spring.application.name=a2a-client-sample
spring.main.web-application-type=none

# The host agent only makes outbound calls.
io.github.khezyapp.a2a.server.enabled=false
io.github.khezyapp.a2a.client.urls[0]=http://localhost:8080/a2a
io.github.khezyapp.a2a.client.call-timeout=30s
# Small SSE guard: a normal reply still fits comfortably.
io.github.khezyapp.a2a.client.sse.max-line-length=4096
