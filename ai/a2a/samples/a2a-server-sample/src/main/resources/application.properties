spring.application.name=a2a-server-sample
server.port=8080

io.github.khezyapp.a2a.server.path=/a2a
io.github.khezyapp.a2a.server.agent-card.name=Math Agent
io.github.khezyapp.a2a.server.agent-card.description=Solves simple arithmetic via A2A
io.github.khezyapp.a2a.server.agent-card.version=1.0.0
io.github.khezyapp.a2a.server.agent-card.url=http://localhost:8080/a2a

# Default profile: in-memory A2A stores, no datasource, no crypto keys required.
io.github.khezyapp.crypto.enabled=false
spring.autoconfigure.exclude=\
  org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,\
  org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration,\
  org.springframework.boot.data.jpa.autoconfigure.DataJpaRepositoriesAutoConfiguration
