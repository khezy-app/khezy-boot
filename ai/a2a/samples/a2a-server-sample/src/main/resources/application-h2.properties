# Second profile: JPA stores on file-backed H2 with AES-GCM encryption at rest.
# Run with: ./gradlew -p ai/a2a/samples/a2a-server-sample bootRun --args='--spring.profiles.active=h2'
spring.autoconfigure.exclude=
spring.datasource.url=jdbc:h2:file:/tmp/khezy-a2a-sample;MODE=PostgreSQL;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

io.github.khezyapp.a2a.store.type=jpa
io.github.khezyapp.crypto.enabled=true
io.github.khezyapp.crypto.active-key-id=dev
io.github.khezyapp.crypto.keys.dev=il435-G146DXzrKWgSJScmwmzMR-H5UZ3reDIwF9rQs
