plugins {
    id("khezy.java-library")
    id("khezy.java-use-mockito")
}

group = "io.github.khezyapp"
version = "1.0.0"

ext {
    a2aSdkVersion = "1.4.0.Final"
}

dependencies {
    api platform("org.a2aproject.sdk:a2a-java-sdk-bom:${a2aSdkVersion}")
    api "org.a2aproject.sdk:a2a-java-sdk-server-common"
    api "org.a2aproject.sdk:a2a-java-sdk-client"
    implementation "org.a2aproject.sdk:a2a-java-sdk-transport-jsonrpc"
}

mavenPublishing {
    pom {
        name = "Khezy A2A Core"
        description = """
        Server business-logic seam and client contracts for A2A, typed on the official
        A2A Java SDK model."""
    }
}
