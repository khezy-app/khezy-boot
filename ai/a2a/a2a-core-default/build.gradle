plugins {
    id("khezy.java-library")
    id("khezy.java-use-mockito")
}

group = "io.github.khezyapp"
version = "1.0.0"

ext {
    a2aCoreVersion = '1.0.0'
    a2aSdkVersion = "1.4.0.Final"
}

dependencies {
    api platform("org.a2aproject.sdk:a2a-java-sdk-bom:${a2aSdkVersion}")
    api "io.github.khezyapp:a2a-core:${a2aCoreVersion}"
    implementation "org.a2aproject.sdk:a2a-java-sdk-client-transport-jsonrpc"
    implementation "org.a2aproject.sdk:a2a-java-sdk-client-transport-rest"
    implementation "org.a2aproject.sdk:a2a-java-sdk-spec-grpc"
}

mavenPublishing {
    pom {
        name = "Khezy A2A Core Default"
        description = """
        SDK-backed defaults for the A2A core contracts: client invoker, connector,
        in-memory conversation store, agent-card resolution and remote agent registry."""
    }
}
