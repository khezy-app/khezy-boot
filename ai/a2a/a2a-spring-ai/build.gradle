plugins {
    id("khezy.java-library")
    id("khezy.java-use-mockito")
}

group = "io.github.khezyapp"
version = "1.0.0"

ext {
    a2aCoreVersion = '1.0.0'
    a2aCoreDefaultVersion = '1.0.0'
    springAiVersion = '2.0.1'
}

dependencies {
    api "io.github.khezyapp:a2a-core:${a2aCoreVersion}"
    api "io.github.khezyapp:a2a-core-default:${a2aCoreDefaultVersion}"
    // ToolCallback/ToolContext are part of this module's public API.
    api "org.springframework.ai:spring-ai-client-chat:${springAiVersion}"
}

mavenPublishing {
    pom {
        name = "Khezy A2A Spring AI"
        description = """
        Optional Spring AI integration for A2A: skill-as-tool, agent-as-tool, prompt
        building and result formatting."""
    }
}
